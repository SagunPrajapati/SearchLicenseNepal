<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driving License Search Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Nepali&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blk:  #0c0c0c;
      --wht:  #f4efe5;
      --red:  #b82016;
      --gold: #c4901e;
      --card: #f4efe5;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--blk);
      color: var(--blk);
      min-height: 100vh;
    }

    /* ─── FIXED BACKGROUND ─── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: var(--blk);
    }
    .bg svg { width: 100%; height: 100%; }

    /* ─── PAGE WRAP ─── */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ─── HEADER ─── */
    header { text-align: center; padding: 52px 20px 36px; }

    .lotus {
      width: 60px; height: 60px;
      margin: 0 auto 18px;
    }

    header h1 {
      font-family: 'Tiro Devanagari Nepali', serif;
      font-size: clamp(1.55rem, 3.8vw, 2.4rem);
      color: var(--wht);
      line-height: 1.3;
      letter-spacing: 0.5px;
    }
    header h1 small {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.52em;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 7px;
    }

    /* Patasi stripe divider */
    .stripe-div {
      margin: 18px auto 0;
      width: min(500px, 88vw);
      height: 22px;
      overflow: hidden;
    }

    header p {
      margin-top: 12px;
      color: rgba(244,239,229,0.42);
      font-size: 0.87rem;
      font-weight: 300;
      letter-spacing: 0.4px;
    }

    /* ─── MAIN ─── */
    main { flex: 1; max-width: 860px; margin: 0 auto; width: 100%; padding: 0 14px 80px; }

    /* Stats */
    .stats { display: none; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
    .stats.on { display: flex; }
    .stat {
      text-align: center;
      border: 1px solid rgba(244,239,229,0.14);
      border-radius: 8px;
      padding: 12px 20px;
      background: rgba(244,239,229,0.04);
      min-width: 120px;
    }
    .stat strong { display: block; font-family: 'Tiro Devanagari Nepali', serif; font-size: 1.6rem; color: var(--gold); line-height: 1; margin-bottom: 4px; }
    .stat span   { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(244,239,229,0.38); }

    /* ─── SEARCH CARD ─── */
    .card {
      background: var(--card);
      border-top:    4px solid var(--red);
      border-bottom: 4px solid var(--red);
      box-shadow: 0 0 0 1px rgba(196,144,30,0.35), 0 18px 56px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    .band {
      height: 18px;
      background: var(--blk);
      overflow: hidden;
      flex-shrink: 0;
    }
    .band svg { width: 100%; height: 18px; display: block; }

    .card-body { padding: 26px 26px 22px; background: var(--card); }

    .card-title {
      font-family: 'Tiro Devanagari Nepali', serif;
      font-size: 1.05rem;
      color: var(--blk);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--blk);
      display: flex; align-items: center; gap: 9px;
    }
    .card-title::before {
      content: '';
      display: inline-block; width: 16px; height: 16px;
      background: var(--blk);
      clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    }

    /* Form */
    .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 520px) { .fg { grid-template-columns: 1fr; } }
    .full { grid-column: 1/-1; }

    .fitem { display: flex; flex-direction: column; gap: 5px; }
    .fitem label { font-size: 0.68rem; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #555; }
    .fitem input {
      padding: 10px 13px;
      border: 1.5px solid #c5bba8;
      border-radius: 2px;
      font-size: 0.94rem;
      font-family: 'DM Sans', sans-serif;
      color: var(--blk);
      background: #fdfaf3;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .fitem input:focus { border-color: var(--blk); box-shadow: 3px 3px 0 var(--blk); background: #fff; }
    .fitem input::placeholder { color: #bbb; }

    /* Buttons */
    .act { display: flex; gap: 11px; margin-top: 18px; flex-wrap: wrap; }
    .btn {
      padding: 10px 28px; border: 2px solid var(--blk); border-radius: 2px;
      font-size: 0.9rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
      cursor: pointer; transition: box-shadow .12s, transform .1s;
      display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0.3px;
    }
    .btn:active { transform: translate(2px,2px); box-shadow: none !important; }
    .bp { background: var(--blk); color: var(--wht); box-shadow: 4px 4px 0 var(--red); }
    .bp:hover { box-shadow: 2px 2px 0 var(--red); }
    .bs { background: transparent; color: var(--blk); box-shadow: 4px 4px 0 #bbb; }
    .bs:hover { box-shadow: 2px 2px 0 #bbb; }

    /* Status & Error */
    .sbar { margin-top: 13px; font-size: 0.84rem; color: #666; min-height: 18px; }
    .sbar .n { font-weight: 700; color: var(--red); }
    .err { display: none; margin-top: 11px; padding: 9px 13px; background: #fff0ee; border-left: 4px solid var(--red); color: var(--red); font-size: 0.87rem; }
    .err.on { display: block; }

    /* Loader */
    .ldr { display: none; text-align: center; padding: 38px; }
    .ldr.on { display: block; }
    .spin { width: 38px; height: 38px; border: 3px solid rgba(244,239,229,.12); border-top-color: var(--gold); border-radius: 50%; animation: sp .7s linear infinite; margin: 0 auto 11px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .ldr p { color: rgba(244,239,229,.38); font-size: .87rem; }

    /* Results */
    #results { margin-top: 22px; display: flex; flex-direction: column; gap: 11px; }

    .rc {
      background: var(--card);
      border-left: 5px solid var(--blk);
      padding: 16px 20px;
      box-shadow: 4px 4px 0 rgba(0,0,0,.32);
      animation: ri .17s ease;
    }
    @keyframes ri { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
    .rc:nth-child(3n+2) { border-left-color: var(--red); }
    .rc:nth-child(3n+3) { border-left-color: var(--gold); }

    .rh { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
    .rsn { font-size: 0.63rem; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: #999; margin-bottom: 2px; }
    .rname { font-family: 'Tiro Devanagari Nepali', serif; font-size: 1.05rem; font-weight: 700; color: var(--blk); }
    .ltag { background: var(--blk); color: var(--wht); font-size: 0.73rem; font-weight: 600; padding: 4px 11px; letter-spacing: .4px; white-space: nowrap; }

    .rd { display: flex; gap: 24px; flex-wrap: wrap; border-top: 1px solid #ddd; padding-top: 11px; }
    .di { display: flex; flex-direction: column; gap: 3px; }
    .dl { font-size: 0.63rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #999; }
    .dv { font-size: 0.88rem; font-weight: 500; color: var(--blk); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { display: inline-block; padding: 2px 9px; background: var(--blk); color: var(--wht); font-size: .7rem; font-weight: 700; letter-spacing: .4px; }

    .empty { text-align: center; padding: 50px 20px; color: rgba(244,239,229,.35); }
    .empty .ic { font-size: 2.5rem; display: block; margin-bottom: 12px; }
    .empty p { font-size: .94rem; }

    /* Footer */
    footer { position: relative; z-index: 1; text-align: center; padding: 18px; font-size: .74rem; color: rgba(244,239,229,.22); border-top: 1px solid rgba(244,239,229,.07); }
    footer strong { color: rgba(244,239,229,.38); }
  </style>
</head>
<body>

<!-- ══════ HAKU PATASI BACKGROUND ══════ -->
<div class="bg">
  <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Core ikat diamond tile — Haku Patasi body pattern -->
      <pattern id="ikat" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <!-- Large diamond outline -->
        <polygon points="20,1 39,20 20,39 1,20" fill="none" stroke="rgba(244,239,229,0.08)" stroke-width="0.7"/>
        <!-- Inner diamond -->
        <polygon points="20,7 33,20 20,33 7,20"  fill="none" stroke="rgba(244,239,229,0.05)" stroke-width="0.5"/>
        <!-- Center mark -->
        <circle cx="20" cy="20" r="1.8" fill="rgba(244,239,229,0.07)"/>
        <!-- Cardinal tick marks — classic dhaka weave detail -->
        <line x1="20" y1="1"  x2="20" y2="6"  stroke="rgba(244,239,229,0.10)" stroke-width="1"/>
        <line x1="39" y1="20" x2="34" y2="20" stroke="rgba(244,239,229,0.10)" stroke-width="1"/>
        <line x1="20" y1="39" x2="20" y2="34" stroke="rgba(244,239,229,0.10)" stroke-width="1"/>
        <line x1="1"  y1="20" x2="6"  y2="20" stroke="rgba(244,239,229,0.10)" stroke-width="1"/>
        <!-- Diagonal weave lines -->
        <line x1="0" y1="0" x2="6" y2="6"   stroke="rgba(244,239,229,0.03)" stroke-width="0.4"/>
        <line x1="40" y1="0" x2="34" y2="6"  stroke="rgba(244,239,229,0.03)" stroke-width="0.4"/>
        <line x1="0" y1="40" x2="6" y2="34"  stroke="rgba(244,239,229,0.03)" stroke-width="0.4"/>
        <line x1="40" y1="40" x2="34" y2="34" stroke="rgba(244,239,229,0.03)" stroke-width="0.4"/>
      </pattern>

      <!-- Top/bottom border band — the bold woven stripe of Haku Patasi -->
      <pattern id="band" x="0" y="0" width="20" height="120" patternUnits="userSpaceOnUse">
        <!-- Alternating hourglass shapes — classic patasi edge motif -->
        <polygon points="0,0 10,8 20,0"       fill="rgba(244,239,229,0.14)"/>
        <polygon points="0,0 0,16 10,8"        fill="rgba(244,239,229,0.08)"/>
        <polygon points="20,0 20,16 10,8"       fill="rgba(244,239,229,0.08)"/>
        <polygon points="0,16 10,24 20,16"      fill="rgba(244,239,229,0.10)"/>
        <polygon points="0,16 0,32 10,24"       fill="rgba(244,239,229,0.06)"/>
        <polygon points="20,16 20,32 10,24"     fill="rgba(244,239,229,0.06)"/>
        <!-- repeating row -->
        <polygon points="0,32 10,40 20,32"      fill="rgba(244,239,229,0.14)"/>
        <polygon points="0,32 0,48 10,40"       fill="rgba(244,239,229,0.08)"/>
        <polygon points="20,32 20,48 10,40"     fill="rgba(244,239,229,0.08)"/>
        <polygon points="0,48 10,56 20,48"      fill="rgba(244,239,229,0.10)"/>
        <polygon points="0,48 0,64 10,56"       fill="rgba(244,239,229,0.06)"/>
        <polygon points="20,48 20,64 10,56"     fill="rgba(244,239,229,0.06)"/>
        <polygon points="0,64 10,72 20,64"      fill="rgba(244,239,229,0.14)"/>
        <polygon points="0,64 0,80 10,72"       fill="rgba(244,239,229,0.08)"/>
        <polygon points="20,64 20,80 10,72"     fill="rgba(244,239,229,0.08)"/>
        <polygon points="0,80 10,88 20,80"      fill="rgba(244,239,229,0.10)"/>
        <polygon points="0,80 0,96 10,88"       fill="rgba(244,239,229,0.06)"/>
        <polygon points="20,80 20,96 10,88"     fill="rgba(244,239,229,0.06)"/>
        <polygon points="0,96 10,104 20,96"     fill="rgba(244,239,229,0.14)"/>
        <polygon points="0,96 0,112 10,104"     fill="rgba(244,239,229,0.08)"/>
        <polygon points="20,96 20,112 10,104"   fill="rgba(244,239,229,0.08)"/>
        <polygon points="0,112 10,120 20,112"   fill="rgba(244,239,229,0.10)"/>
        <polygon points="0,112 0,120 10,120"    fill="rgba(244,239,229,0.06)"/>
        <polygon points="20,112 20,120 10,120"  fill="rgba(244,239,229,0.06)"/>
      </pattern>

      <!-- Subtle centre glow -->
      <radialGradient id="glow" cx="50%" cy="42%" r="55%">
        <stop offset="0%"   stop-color="#1b1b32" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Full-canvas ikat body -->
    <rect width="100%" height="100%" fill="url(#ikat)"/>

    <!-- TOP border band -->
    <rect x="0"   y="0"              width="100%" height="110" fill="url(#band)"/>
    <!-- red accent line below top band -->
    <rect x="0"   y="109"            width="100%" height="4"   fill="#b82016" opacity="0.85"/>
    <!-- gold pin-stripe -->
    <rect x="0"   y="113"            width="100%" height="1.5" fill="#c4901e" opacity="0.65"/>

    <!-- BOTTOM border band -->
    <rect x="0"   y="calc(100% - 110px)" width="100%" height="110" fill="url(#band)"/>
    <rect x="0"   y="calc(100% - 113px)" width="100%" height="4"   fill="#b82016" opacity="0.85"/>
    <rect x="0"   y="calc(100% - 114.5px)" width="100%" height="1.5" fill="#c4901e" opacity="0.65"/>

    <!-- LEFT vertical chevron stripe -->
    <pattern id="vchev" x="0" y="0" width="28" height="14" patternUnits="userSpaceOnUse">
      <polyline points="0,14 14,0 28,14" fill="none" stroke="rgba(244,239,229,0.15)" stroke-width="1.2"/>
    </pattern>
    <rect x="0"             y="0" width="28"  height="100%" fill="url(#vchev)"/>
    <rect x="27"            y="0" width="3"   height="100%" fill="#b82016" opacity="0.6"/>

    <!-- RIGHT vertical chevron stripe -->
    <rect x="calc(100% - 28px)" y="0" width="28"  height="100%" fill="url(#vchev)"/>
    <rect x="calc(100% - 30px)" y="0" width="3"   height="100%" fill="#b82016" opacity="0.6"/>

    <!-- Centre soft glow -->
    <rect width="100%" height="100%" fill="url(#glow)"/>
  </svg>
</div>

      </svg>
    </div>

    <p>Search distribution records by name, license number, or category</p>
  </header>

  <main>

    <!-- Stats strip -->
    <div class="stats" id="stats">
      <div class="stat"><strong id="st-tot">—</strong><span>Total Records</span></div>
      <div class="stat"><strong id="st-dist">—</strong><span>Distribution Date</span></div>
      <div class="stat"><strong id="st-upd">—</strong><span>Last Updated</span></div>
    </div>

    <!-- Search card -->
    <div class="card">

      <!-- Top woven band -->
      <div class="band">
        <svg viewBox="0 0 860 18" width="100%" height="18" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="860" height="18" fill="#0c0c0c"/>
          <g fill="rgba(244,239,229,0.18)">

<script>
  let DB = [];

  async function init() {
    tog('ldr', true);
    try {
      const r = await fetch('data/records.json?t=' + Date.now());
      if (!r.ok) throw 0;
      const j = await r.json();
      DB = j.records || [];
      const lu   = j.lastUpdated || '—';
      const dist = (DB[0] && DB[0].distributionReadyDate) || '—';
      q('#st-tot').textContent  = DB.length;
      q('#st-dist').textContent = dist;
      q('#st-upd').textContent  = lu;
      q('#fu').textContent      = lu;
      q('#fd').textContent      = dist;
      q('#stats').classList.add('on');
    } catch(e) {
      q('#results').innerHTML = `<div class="empty"><span class="ic">⚠️</span><p>Could not load <code>data/records.json</code>. Check your GitHub repo structure.</p></div>`;
    }
    tog('ldr', false);
  }

  ['n','l','c'].forEach(id => q('#'+id).addEventListener('keydown', e => { if(e.key==='Enter') go(); }));

  function go() {
    q('#err').textContent=''; q('#err').classList.remove('on');
    const name = q('#n').value.trim().toLowerCase();
    const lic  = q('#l').value.trim().toLowerCase();
    const cat  = q('#c').value.trim().toLowerCase();
    if (!name && !lic && !cat) { showErr('Please enter at least one search term.'); return; }

    const hits = DB.filter(r =>
      (name ? r.name.toLowerCase().includes(name) : true) &&
      (lic  ? r.licenseNumber.toLowerCase().includes(lic)  : true) &&
      (cat  ? r.category.toLowerCase().includes(cat)       : true)
    );
    render(hits);
  }

  function render(list) {
    const el  = q('#results');
    const bar = q('#sbar');
    el.innerHTML = '';
    if (!list.length) {
      bar.innerHTML = `Found <span class="n">0</span> result(s).`;
      el.innerHTML  = `<div class="empty"><span class="ic">🔍</span><p>No matching records found.</p></div>`;
      return;
    }
    bar.innerHTML = `Found <span class="n">${list.length}</span> result(s).`;
    list.forEach(r => {
      const chips = (r.category||'').split(',').map(c=>c.trim()).filter(Boolean)
        .map(c=>`<span class="chip">${e(c)}</span>`).join('');
      const d = document.createElement('div');
      d.className = 'rc';
      d.innerHTML = `
        <div class="rh">
          <div>
            <div class="rsn">S.N. ${e(String(r.sn||'—'))}</div>
            <div class="rname">${e(r.name)}</div>
          </div>
          <span class="ltag">${e(r.licenseNumber)}</span>
        </div>
        <div class="rd">
          <div class="di"><span class="dl">Category</span><div class="chips">${chips||'—'}</div></div>
          <div class="di"><span class="dl">Distribution Date</span><span class="dv">${e(r.distributionReadyDate||'—')}</span></div>
        </div>`;
      el.appendChild(d);
    });
  }

  function cl() {
    ['n','l','c'].forEach(id => q('#'+id).value='');
    q('#err').textContent=''; q('#err').classList.remove('on');
    q('#results').innerHTML='';
    q('#sbar').innerHTML='';
  }
  function showErr(m) { q('#err').textContent=m; q('#err').classList.add('on'); }
  function tog(id,on) { q('#'+id).classList.toggle('on', on); }
  function q(s) { return document.querySelector(s); }
  function e(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  init();
</script>
